{% extends "base.html" %}
{% block title %}个人信息{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-person-badge"></i> 个人信息 (首页 / 关于页)</h4>

{% if saved %}
<div class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle"></i> 已保存,刷新网站首页即可看到效果
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}

<div class="alert alert-info d-flex align-items-center" role="alert">
    <i class="bi bi-info-circle me-2"></i>
    <span>教育经历已合并至「<a href="/admin/content/timeline" class="alert-link">时间线</a>」管理,请到时间线中编辑</span>
</div>

<form method="POST">
    <div class="card stat-card mb-4">
        <div class="card-header bg-white"><i class="bi bi-person"></i> 基本信息</div>
        <div class="card-body row g-3">
            <div class="col-md-4">
                <label class="form-label">姓名/昵称</label>
                <input type="text" class="form-control" name="name" value="{{ profile.get('name', '') }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">别名</label>
                <input type="text" class="form-control" name="alias" value="{{ profile.get('alias', '') }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">头衔</label>
                <input type="text" class="form-control" name="title" value="{{ profile.get('title', '') }}">
            </div>
            <div class="col-12">
                <label class="form-label">副标题</label>
                <input type="text" class="form-control" name="subtitle" value="{{ profile.get('subtitle', '') }}">
            </div>
            <div class="col-12">
                <label class="form-label">简介 bio</label>
                <textarea class="form-control" name="bio" rows="3">{{ profile.get('bio', '') }}</textarea>
            </div>
            <div class="col-md-4">
                <label class="form-label">所在地</label>
                <input type="text" class="form-control" name="location" value="{{ profile.get('location', '') }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" name="email" value="{{ profile.get('email', '') }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">GitHub</label>
                <input type="text" class="form-control" name="social_github" value="{{ profile.get('social', {}).get('github', '') }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">博客链接</label>
                <input type="text" class="form-control" name="social_blog" value="{{ profile.get('social', {}).get('blog', '') }}">
            </div>
        </div>
    </div>

    <div class="card stat-card mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span><i class="bi bi-stars"></i> 首页亮点数据</span>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addHlRow()">
                <i class="bi bi-plus-lg"></i> 添加亮点
            </button>
        </div>
        <div class="card-body" id="hl-container">
            {% for h in profile.get('highlights', []) %}
            <div class="hl-row border rounded p-3 mb-3 position-relative">
                <button type="button" class="btn-close position-absolute" style="top:10px;right:10px"
                        onclick="this.closest('.hl-row').remove()"></button>
                <div class="row g-2">
                    <div class="col-md-3"><input class="form-control" name="hl_icon" placeholder="图标(bi-trophy)" value="{{ h.get('icon','') }}"></div>
                    <div class="col-md-3"><input class="form-control" name="hl_label" placeholder="标签(如 竞赛金奖)" value="{{ h.get('label','') }}"></div>
                    <div class="col-md-6"><input class="form-control" name="hl_value" placeholder="数值(如 全国第一)" value="{{ h.get('value','') }}"></div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存全部</button>
        <a href="/admin" class="btn btn-outline-secondary">返回总览</a>
    </div>
</form>

<script>
function addHlRow() {
    const c = document.getElementById('hl-container');
    const div = document.createElement('div');
    div.className = 'hl-row border rounded p-3 mb-3 position-relative';
    div.innerHTML = `
        <button type="button" class="btn-close position-absolute" style="top:10px;right:10px" onclick="this.closest('.hl-row').remove()"></button>
        <div class="row g-2">
            <div class="col-md-3"><input class="form-control" name="hl_icon" placeholder="图标(bi-trophy)"></div>
            <div class="col-md-3"><input class="form-control" name="hl_label" placeholder="标签"></div>
            <div class="col-md-6"><input class="form-control" name="hl_value" placeholder="数值"></div>
        </div>`;
    c.appendChild(div);
}
</script>
{% endblock %}
